<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#container{
    width:100vw;
    height:100vh;
    overflow:hidden;
}

iframe{
    /* Esquerda */
    margin-left:-3px;

    /* 3 px da esquerda + 4 px da direita */
    width:calc(100% + 7px);

    /* Parte de baixo */
    height:calc(100% + 63px);

    border:none;
}

</style>

</head>

<body>

<div id="container">
    <iframe
        src=""

        allowfullscreen>
    </iframe>
</div>

</body>
</html>
